    <body>
      <div class="container">

      <script>
        function showToast(message, isError = false) {
          let toast = document.getElementById("toast");

          if (!toast) {
            toast = document.createElement("div");
            toast.id = "toast";
            document.body.appendChild(toast);
          }

          toast.innerText = message;
          toast.className = "toast show " + (isError ? "error" : "success");

          setTimeout(() => {
            toast.className = "toast";
          }, 3000);
        }

        let recordId = null;
let recordData = null;
let cmaData = null;
let cmaSearchOptions = null;

// CMA search state
let comparableSearchCompleted = false;
let comparableSearchInProgress = false;
let editableMarketFloor = null;
let editableMarketCeiling = null;

        /* ===== INIT ===== */
        window.addEventListener("load", function () {
          if (typeof ZOHO === "undefined") {
            console.error("ZOHO SDK not loaded");
            return;
          }

          ZOHO.embeddedApp.on("PageLoad", function (data) {
            // Ensure ID is a string and not an array
            recordId = Array.isArray(data.EntityId)
              ? data.EntityId[0]
              : data.EntityId;

            // Only call if recordId exists
            if (recordId) {
              loadRecord(data.Entity);
            }
          });

          ZOHO.embeddedApp.init();
        });

        /* ===== LOAD RECORD ===== */
        function loadRecord(entity) {
          ZOHO.CRM.API.getRecord({
            Entity: entity,
            RecordID: recordId,
          }).then(function (res) {
            if (!res || !res.data || res.data.length === 0) {
              showToast("No property data found.", true);
              return;
            }

            recordData = res.data[0];
  window.recordData = recordData;

  openComparableSales();
          });
        }
        function showComparableSearchConfirmation(searchOptions) {
  return new Promise((resolve) => {
    const priceSelect = document.getElementById("comparablePriceRange");
    const bedroomSelect = document.getElementById("comparableBedrooms");
    const bathroomSelect = document.getElementById("comparableBathrooms");
    const radiusSelect = document.getElementById("comparableRadius");
    const limitSelect = document.getElementById("comparableLimit");

    const priceLabel =
      priceSelect?.options[priceSelect.selectedIndex]?.text || "All Prices";

    const bedroomLabel =
      bedroomSelect?.options[bedroomSelect.selectedIndex]?.text || "Any";

    const bathroomLabel =
      bathroomSelect?.options[bathroomSelect.selectedIndex]?.text || "Any";

    const radiusLabel =
      radiusSelect?.options[radiusSelect.selectedIndex]?.text || `${searchOptions.radius} km`;

    const limitLabel =
      limitSelect?.options[limitSelect.selectedIndex]?.text || searchOptions.limit;

    const overlay = document.createElement("div");

    overlay.id = "cmaSearchConfirmationModal";

    overlay.className = "modal-overlay";

    overlay.innerHTML = `
      <div
        class="modal-box"
        style="
          width:420px;
          max-width:calc(100vw - 32px);
          padding:24px;
        "
      >

        <div
          style="
            font-size:18px;
            font-weight:600;
            margin-bottom:8px;
            color:#111;
          "
        >
          Confirm Comparable Sales Search
        </div>

        <div
          style="
            font-size:13px;
            color:#666;
            margin-bottom:18px;
            line-height:1.5;
          "
        >
          Proceed with the selected search criteria?
        </div>

        <div
          style="
            border:1px solid #eee;
            border-radius:10px;
            padding:12px;
            background:#fafafa;
            margin-bottom:20px;
          "
        >

          <div style="display:flex;justify-content:space-between;padding:6px 0;">
            <span style="color:#777;">Price Range</span>
            <b style="color:#111;">${priceLabel}</b>
          </div>

          <div style="display:flex;justify-content:space-between;padding:6px 0;">
            <span style="color:#777;">Bedrooms</span>
            <b style="color:#111;">${bedroomLabel}</b>
          </div>

          <div style="display:flex;justify-content:space-between;padding:6px 0;">
            <span style="color:#777;">Bathrooms</span>
            <b style="color:#111;">${bathroomLabel}</b>
          </div>

          <div style="display:flex;justify-content:space-between;padding:6px 0;">
            <span style="color:#777;">Radius</span>
            <b style="color:#111;">${radiusLabel}</b>
          </div>

          <div style="display:flex;justify-content:space-between;padding:6px 0;">
            <span style="color:#777;">Results</span>
            <b style="color:#111;">${limitLabel}</b>
          </div>

        </div>

        <div
          style="
            display:flex;
            justify-content:flex-end;
            gap:10px;
          "
        >

          <button
            type="button"
            id="cmaSearchCancel"
            style="
              background:#fff;
              color:#222;
              border:1px solid #ccc;
              padding:10px 18px;
              border-radius:8px;
              font-weight:600;
              cursor:pointer;
            "
          >
            Cancel
          </button>

          <button
            type="button"
            id="cmaSearchProceed"
            style="
              background:#1f1f1f;
              color:#fff;
              border:none;
              padding:10px 18px;
              border-radius:8px;
              font-weight:600;
              cursor:pointer;
            "
          >
            Proceed
          </button>

        </div>

      </div>
    `;

    document.body.appendChild(overlay);

    const closeModal = (result) => {
      overlay.remove();
      resolve(result);
    };

    document
      .getElementById("cmaSearchCancel")
      .addEventListener("click", () => {
        closeModal(false);
      });

    document
      .getElementById("cmaSearchProceed")
      .addEventListener("click", () => {
        closeModal(true);
      });

    overlay.addEventListener("click", (event) => {
      if (event.target === overlay) {
        closeModal(false);
      }
    });
  });
}

          document.getElementById("cmaContainer").innerHTML = `

</div>

  await loadAvailableCredits();
  let searchOptions;

if (searchOptionsOverride) {

  searchOptions = searchOptionsOverride;

  const searchButton = document.getElementById("startComparableSearch");

  if (searchButton) {
    searchButton.disabled = true;
    searchButton.innerText = "Searching...";
    searchButton.style.opacity = "0.7";
    searchButton.style.cursor = "not-allowed";
  }

  comparableSearchInProgress = true;

  document.getElementById("comparableSalesContent").innerHTML = `
    <div style="padding:20px; text-align:center; color:#777;">
      Fetching comparable sales...
    </div>
  `;

} else {

  searchOptions = await new Promise((resolve) => {

    const searchButton = document.getElementById("startComparableSearch");

    searchButton.addEventListener("click", async () => {

      // Prevent duplicate clicks while a search is running
      if (comparableSearchInProgress) {
        return;
      }

      const priceRange =
        document.getElementById("comparablePriceRange").value;

      const bedrooms =
        document.getElementById("comparableBedrooms").value;

      const bathrooms =
        document.getElementById("comparableBathrooms").value;

      const limit =
        document.getElementById("comparableLimit").value;

      const radius =
        document.getElementById("comparableRadius").value;

      const selectedOptions = {
        priceRange,
        bedrooms,
        bathrooms,
        limit,
        radius
      };


      // =====================================================
      // IF A SEARCH HAS ALREADY COMPLETED → SEARCH AGAIN
      // =====================================================

      if (comparableSearchCompleted) {

        const confirmed =
          await showComparableSearchConfirmation(selectedOptions);

        if (!confirmed) {
          return;
        }

        openComparableSales(selectedOptions);

        return;
      }


      // =====================================================
      // FIRST SEARCH → CONFIRM BEFORE API CALL
      // =====================================================

      const confirmed =
        await showComparableSearchConfirmation(selectedOptions);

      if (!confirmed) {
        return;
      }


      comparableSearchInProgress = true;

      searchButton.disabled = true;

        function editMarketValue(type) {

const isCeiling = type === "ceiling";

const currentValue = isCeiling
    ? editableMarketCeiling
    : editableMarketFloor;

const displayId = isCeiling
    ? "marketCeilingDisplay"
    : "marketFloorDisplay";

const label = isCeiling
    ? "Market Ceiling"
    : "Market Floor";

const display = document.getElementById(displayId);

display.innerHTML = `
    <input
        id="${type}MarketInput"
        type="text"
        value="${currentValue}"
        style="
            width:140px;
            height:32px;
            padding:4px 8px;
            border:1px solid #bbb;
            border-radius:6px;
            font-size:16px;
            font-weight:700;
            text-align:center;
            box-sizing:border-box;
        "
    >

    <button
        type="button"
        onclick="saveMarketValue('${type}')"
        style="
            border:none;
            background:transparent;
            cursor:pointer;
            font-size:18px;
            padding:2px;
        "
        title="Save ${label}"
    >
        ✔️
    </button>
`;

const input = document.getElementById(`${type}MarketInput`);

input.focus();
input.select();
}

function saveMarketValue(type) {

const input = document.getElementById(`${type}MarketInput`);

if (!input) {
    return;
}

const cleanedValue = input.value
    .replace(/[$,\s]/g, "")
    .trim();

const numericValue = Number(cleanedValue);

if (!Number.isFinite(numericValue) || numericValue < 0) {
    showToast("Please enter a valid market value.", true);
    input.focus();
    return;
}

if (type === "ceiling") {
    editableMarketCeiling = numericValue;
} else {
    editableMarketFloor = numericValue;
}

renderEditableMarketValues();
}

function renderEditableMarketValues() {

const ceilingDisplay = document.getElementById("marketCeilingDisplay");
const floorDisplay = document.getElementById("marketFloorDisplay");

if (ceilingDisplay) {
    ceilingDisplay.innerHTML = `
        $${editableMarketCeiling.toLocaleString()}
        <button
            type="button"
            onclick="editMarketValue('ceiling')"

                padding:2px;

            ✏️

}

if (floorDisplay) {

                font-size:14px;
                padding:2px;
            "
            title="Edit Market Floor"
        >
            ✏️
        </button>
    `;
}
}

  async function generateCMAPDF() {

  if (!recordData) {

      showToast("Property record not loaded.", true);

      return;

  }

  if (!cmaData) {

      showToast("Please search comparable sales first.", true);

      return;

  }

  const currentUserResponse = await ZOHO.CRM.CONFIG.getCurrentUser();

  const currentUser = currentUserResponse?.users?.[0] || {};

  const payload = {

      property: recordData,

      comparableSales: cmaData.comparableSales,

      search: {
      radius: cmaSearchOptions.radius,
      results: cmaSearchOptions.limit,
      marketFloor: editableMarketFloor,
marketCeiling: editableMarketCeiling
  },

      generatedBy: {

          name: currentUser.full_name,

          email: currentUser.email,

          phone: currentUser.phone

      },

      generatedAt: new Date().toISOString()

  };

  console.log("CMA PAYLOAD");

  showToast("Your download will start in few seconds...");

  const response = await fetch(
      "https://project-rainfall-7006542512.development.catalystserverless.com.au/server/generatecmapdf/",
      {
          method: "POST",
          credentials: "include",
          headers: {
              "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
      }
  );

  const blob = await response.blob();

  const url = window.URL.createObjectURL(blob);

  const link = document.createElement("a");

  link.href = url;

  const today = new Date();

  const dd = String(today.getDate()).padStart(2, "0");
  const mm = String(today.getMonth() + 1).padStart(2, "0");
  const yyyy = today.getFullYear();

  link.download = `CMA_${dd}${mm}${yyyy}_REPORT.pdf`;

  document.body.appendChild(link);

  link.click();

  link.remove();

  window.URL.revokeObjectURL(url);

  }

        async function updateHTagSenderRecord(creditData) {
          try {
            const senderSearch = await ZOHO.CRM.API.searchRecord({
              Entity: "Sender_IDs",
              Type: "criteria",
              Query: "(Sender_Type:equals:HTag)",
            });

            if (!senderSearch.data || senderSearch.data.length === 0) {
              console.log("HTag Sender_ID not found");
              return;
            }

            const senderId = senderSearch.data[0].id;

            const zohoDateTime =
              new Date().toISOString().split(".")[0] + "+00:00";

            console.log("DATETIME:", zohoDateTime);

            const lastTopUpDate = creditData.last_topup_date
              ? new Date(creditData.last_topup_date.replace(" ", "T"))
                  .toISOString()
                  .split(".")[0] + "+00:00"
              : null;

            const config = {
              Entity: "Sender_IDs",
              APIData: {
                id: senderId,

                Last_Credit_Usage_Date: zohoDateTime,

                Available_Credits: creditData.available_credits,

                Last_Credits_Consumed: creditData.last_credits_consumed,

                Credit_Status: creditData.credit_status,

                Last_Top_Up: creditData.last_topup,

                Last_Top_Up_Date: lastTopUpDate,

                Total_Credits_Purchased: creditData.total_credits_purchased,
              },
            };

            console.log(
              "TOTAL_CREDITS_PURCHASED SENT:",
              creditData.total_credits_purchased
            );

            console.log("SENDER UPDATE CONFIG:", config);

            const updateResponse = await ZOHO.CRM.API.updateRecord(config);

            console.log("SENDER UPDATE RESPONSE:", updateResponse);
            await loadAvailableCredits();
          } catch (error) {
            console.error("COMPARABLE SALES ERROR:", error);

            let errorMessage = "Unknown error. please contact support@agenttime.au.";

            if (error.message) {
              errorMessage = error.message;
            }

            if (error.error) {
              errorMessage = error.error;
            }

            if (
              error.responseJSON &&
              error.responseJSON.message
            ) {
              errorMessage = error.responseJSON.message;
            }

            if (typeof error === "string") {
              errorMessage = error;
            }

            document.getElementById("comparableSalesContent").innerHTML = `
              <div style="color:red;">
                Failed to load comparable sales. please contact support@agenttime.au.
                <br><br>
                Error:
                <br><br>
